name: Build Nexa Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Nexa Finance ZIP
        run: |
          if [ ! -f "NexaFinance-Premium-Project.zip" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            echo "Pastikan ZIP ada di folder utama repository."
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -o NexaFinance-Premium-Project.zip -d project

      - name: Build Android APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Finance-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
